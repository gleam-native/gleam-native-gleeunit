# Polyglot fork of gleeunit 1.11.0: the erlang and javascript runners are
# untouched; native fallback bodies let the package compile on the native
# target, where `gleam test`'s built-in discovery runner is used instead
# of `gleeunit.main`.
name = "gleeunit"
version = "1.11.0"
licences = ["Apache-2.0"]
description = "A simple test runner for Gleam, using EUnit on Erlang"
repository = { type = "github", user = "lpil", repo = "gleeunit" }
links = [{ title = "Sponsor", href = "https://github.com/sponsors/lpil" }]
gleam = ">= 1.13.0"

[javascript.deno]
allow_read = ["gleam.toml", "test", "build"]

[dependencies]
gleam_stdlib = { path = "../gleam-stdlib-native" }

[dev-dependencies]
testhelper = { "path" = "./testhelper" }
